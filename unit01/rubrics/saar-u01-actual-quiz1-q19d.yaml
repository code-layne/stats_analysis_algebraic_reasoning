# Rubric for saar-u01-actual-quiz1 item q19d (unit01/quiz01/actual_quiz).
id: q19d
points: 3
task: "A teacher draws 2 homerooms (built by grade) and surveys all 56 students; 42 say yes (75%, pointing to 630 of 840). Her arithmetic is correct. Explain what is wrong with her report, and state what she is allowed to say."
criteria:
  - id: alike
    points: 1.5
    full: "Homerooms are built by grade, so each is alike inside (a stratum, not a mix), so her 56 students are one or two grades and the 75% says nothing about all 840."
  - id: allowed
    points: 1.5
    full: "She may only say 75% of those 56 students said yes."
