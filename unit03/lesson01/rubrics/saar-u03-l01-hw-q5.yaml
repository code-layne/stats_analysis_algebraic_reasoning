# Rubric for saar-u03-l01-hw item q5 (unit03/lesson01/homework).
id: q5
points: 2
task: "The director says adopters 18-34 took home 60 cats and adopters 55 and over took home only 30, so younger adopters are more likely to choose a cat. Do you agree? Justify with the percents that settle it."
criteria:
  - id: percents
    points: 1
    full: "Finds both conditional percents: 60/150 = 40% of adopters 18-34 and 30/50 = 60% of adopters 55 and over."
  - id: verdict
    points: 1
    full: "Disagrees and gives the reason in context: the director compared counts from groups of different sizes; adopters 55 and over are more likely to choose a cat."
