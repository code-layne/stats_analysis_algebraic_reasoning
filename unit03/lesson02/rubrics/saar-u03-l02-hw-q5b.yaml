# Rubric for saar-u03-l02-hw item q5b (unit03/lesson02/homework).
id: q5b
points: 1
task: "Venn diagram of 60 members: only mystery 19, both 7, only graphic novel 10, neither 24. Priya adds the circle totals, 26 + 17 = 43. Why is her count too high? Name the members she counted twice."
criteria:
  - id: who
    points: 0.5
    full: "Names the 7 members who bought both (the overlap) as the ones counted twice."
  - id: why
    points: 0.5
    full: "Explains that the overlap is inside each circle total, so adding the totals counts it twice; the correct count takes each region once (19 + 7 + 10 = 36, or 43 - 7 = 36)."
