points: 2
task: "Sam's line read 0.80 after 20 trips and 0.64 after 200. Which value should the coach trust? Explain using the Law of Large Numbers."
criteria:
  - id: value
    points: 0.5
    full: "Chooses 0.64, the value after 200 trips."
