# Rubric for saar-u03-l03-hw item q6 (unit03/lesson03/homework).
id: q6
points: 2
task: "Tessa says a slice cannot have a star and a skull, so those events must be independent. Is she right? Answer with numbers, then say what they mean for a spin."
criteria:
  - id: numbers
    points: 1
    full: "No, they are dependent: P(S and K) = 0, but P(S) times P(K) = (0.25)(0.2) = 0.05, and the two are not equal."
  - id: meaning
    points: 1
    full: "In context: knowing the slice has a star changes the chance of a skull from 0.2 to 0 (it tells you the other event did not happen)."
