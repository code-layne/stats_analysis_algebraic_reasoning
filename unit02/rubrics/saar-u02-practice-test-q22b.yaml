# Rubric for saar-u02-practice-test item q22b (unit02/tests/practice_test).
id: q22b
points: 5
task: "Compare the two groups' hours of sleep on a school night (juniors and seniors) (parallel boxplots), with a comparative word for center and for spread."
criteria:
  - id: center
    points: 2.5
    full: "Compares centers with a comparative word and values: juniors' median (7 h) is greater than seniors' (6.5 h)."
  - id: spread
    points: 2.5
    full: "Compares spreads with a comparative word and values: seniors' sleep is more spread out (IQR 2.5 h vs. 1.5 h), so juniors' sleep is more consistent."
